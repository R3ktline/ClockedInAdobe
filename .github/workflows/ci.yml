name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: No env files committed
        run: |
          bad=$(git ls-files | grep -E '(^|/)\.env' | grep -v -E '(^|/)\.env\.example$' || true)
          if [ -n "$bad" ]; then echo "Committed env files:"; echo "$bad"; exit 1; fi

      # Node steps are skipped until the app is scaffolded (no package.json yet).
      - uses: actions/setup-node@v4
        if: hashFiles('package.json') != ''
        with:
          node-version: 22
          cache: npm

      - name: Install
        if: hashFiles('package.json') != ''
        run: npm ci

      - name: Typecheck
        if: hashFiles('package.json') != ''
        run: npm run typecheck --if-present

      - name: Lint
        if: hashFiles('package.json') != ''
        run: npm run lint --if-present

      - name: Test
        if: hashFiles('package.json') != ''
        run: npm test --if-present

      - name: Build
        if: hashFiles('package.json') != ''
        run: npm run build --if-present
